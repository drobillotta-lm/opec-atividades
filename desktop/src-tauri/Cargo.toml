[package]
name = "atividades-opec-notch"
version = "0.3.0"
description = "Notch do Sr. Minutos: o cronômetro do Atividades OPEC preso na borda da tela"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: janela transparente no macOS (no Windows não faz nada).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# O token do aparelho mora no cofre do sistema: Gerenciador de Credenciais no Windows,
# Keychain no macOS. Mesma API, backend por plataforma.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
