name: Importar da Escala

# 08h e 20h BRT = 11h e 23h UTC (Brasil sem horario de verao hoje, opec-escala/docs/21-onde-paramos.md).
# O Vercel Hobby so permite cron nativo 1x/dia; o GitHub Actions fica no papel de
# relogio para as duas rodadas, chamando a rota que faz o trabalho de verdade.
on:
  schedule:
    - cron: "0 11,23 * * *"
  workflow_dispatch: {}

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar /api/importar-escala
        # Sem -f: o corpo da resposta e o que diz o que deu errado (a rota devolve
        # {"erro": ...}); com -f o log so mostrava "curl: (22)" e o relogio ficou
        # parado dias sem ninguem ver. O passo falha pelo codigo HTTP, nao pelo curl.
        run: |
          codigo=$(curl -s -o resposta.json -w "%{http_code}" -X POST "https://opec-atividades.vercel.app/api/importar-escala" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "content-type: application/json")
          echo "HTTP $codigo"; cat resposta.json; echo
          test "$codigo" = "200"
